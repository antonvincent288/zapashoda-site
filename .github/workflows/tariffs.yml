name: Update tariffs

on:
  schedule:
    - cron: "30 4 * * *"   # 07:30 МСК ежедневно
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astrowind-migration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch_tariffs.py
      - name: Commit updated tariffs
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "zapashoda-tariffs-bot"
            git config user.email "bot@zapashoda-ev.ru"
            git add site/public/tariffs.json
            git commit -m "Tariffs: автообновление от источников сетей"
            git push
          else
            echo "No tariff changes"
          fi
