name: Update EV stations base

on:
  schedule:
    - cron: '0 5 8 * *'   # 8-го числа каждого месяца в 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astrowind-migration
      - name: Harvest Yandex SSR + enrich from OSM
        run: python3 agents/scripts/harvest_stations.py
      - name: Commit if changed
        run: |
          git config user.name "zapashoda-bot"
          git config user.email "bot@zapashoda-ev.ru"
          if [[ -n $(git status --porcelain -- 'site/public/charging/stations.json' 'static/charging/stations.json') ]]; then
            git add site/public/charging/stations.json static/charging/stations.json
            git commit -m "map: monthly stations base update (auto)"
            git push
          else
            echo "No changes"
          fi
