name: Astro QA (astrowind-migration)
on:
  push:
    branches: [astrowind-migration]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pre
        run: |
          if [ -f site/package.json ]; then echo "scaffold=yes" >> "$GITHUB_OUTPUT"; else echo "scaffold=no" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.pre.outputs.scaffold == 'yes'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install deps
        if: steps.pre.outputs.scaffold == 'yes'
        run: npm ci
        working-directory: site
      - name: Build
        if: steps.pre.outputs.scaffold == 'yes'
        run: npm run build
        working-directory: site
      - name: Pagefind index
        if: steps.pre.outputs.scaffold == 'yes'
        run: npx --yes pagefind --site dist
        working-directory: site
      - name: Smoke checks (og, JSON-LD, sitemap)
        if: steps.pre.outputs.scaffold == 'yes'
        run: |
          test -f dist/index.html
          test -f dist/sitemap-index.xml
          grep -rl 'property="og:title"' dist --include='*.html' | head -1
          grep -rl 'application/ld+json' dist --include='*.html' | head -1
          test -f dist/models/index.html || { echo 'MISSING dist/models/index.html'; exit 1; }
          test -f dist/models/zeekr-001-001-fr/index.html || { echo 'MISSING model detail'; exit 1; }
          test -f dist/blog/index.html || { echo 'MISSING dist/blog/index.html'; exit 1; }
          test -f dist/blog/gbt-stancii-2026/index.html || { echo 'MISSING blog detail'; exit 1; }
          test -f dist/pain/index.html || { echo 'MISSING dist/pain/index.html'; exit 1; }
          test -f dist/pain/12v-akb/index.html || { echo 'MISSING pain detail'; exit 1; }
          test -f dist/safety/index.html || { echo 'MISSING dist/safety/index.html'; exit 1; }
          test -f dist/llms.txt || { echo 'MISSING llms.txt'; exit 1; }
          test -f dist/assets/og/b-gbt-stancii-2026.png || { echo 'MISSING og article image'; exit 1; }
          test -f dist/assets/og/m-aito-m5-m7.png || { echo 'MISSING og model image'; exit 1; }
          grep -q FAQPage dist/pain/12v-akb/index.html || { echo 'MISSING FAQPage JSON-LD on pain article'; exit 1; }
          grep -q "comments" dist/blog/gbt-stancii-2026/index.html || echo 'note: legacy comments removed from blog detail'
          test -f dist/shop/digital/index.html || { echo 'MISSING dist/shop/digital/index.html'; exit 1; }
          test -f dist/charging/index.html || { echo 'MISSING dist/charging/index.html'; exit 1; }
          test -f dist/charging/stations.json || { echo 'MISSING stations.json'; exit 1; }
          test -f dist/assets/leaflet/leaflet.js || { echo 'MISSING leaflet.js'; exit 1; }
          grep -q "Зарядные станции рядом" dist/charging/index.html || { echo 'MISSING charging H1'; exit 1; }
          test -f dist/quiz/index.html || { echo 'MISSING dist/quiz/index.html'; exit 1; }
          test -f dist/b2b/index.html || { echo 'MISSING dist/b2b/index.html'; exit 1; }
          test -f dist/b2b/paket-dileram.pdf || { echo 'MISSING paket-dileram.pdf'; exit 1; }
          test -f dist/rss.xml || { echo 'MISSING rss.xml'; exit 1; }
          test -f dist/catalog/index.html || { echo 'MISSING dist/catalog/index.html'; exit 1; }
          CITEM=dist/catalog/adapter-type2-gbt-premium.html
          [ -f "$CITEM" ] || CITEM=dist/catalog/adapter-type2-gbt-premium/index.html
          [ -f "$CITEM" ] || { echo 'MISSING catalog item (both paths)'; exit 1; }
          grep -q "₽" dist/catalog/index.html || { echo 'MISSING price in catalog'; exit 1; }
          grep -q "Адаптер Type 2 → GB/T, 22 кВт, премиум" "$CITEM" || { echo 'MISSING item title'; exit 1; }
          test -f dist/services/index.html || { echo 'MISSING dist/services/index.html'; exit 1; }
          test -f dist/cost/avatr-11-12-ofitsialno-ru.html || { echo 'MISSING cost page'; exit 1; }
          test -f dist/news/index.html || { echo 'MISSING dist/news/index.html'; exit 1; }
          test -f dist/about/index.html || { echo 'MISSING dist/about/index.html'; exit 1; }
          echo "SMOKE OK (catalog + products + about + shop + map + quiz + b2b + rss)"   
        working-directory: site
      - name: Pack offline preview
        if: success()
        run: python3 scripts/make_preview.py
      - name: Commit preview
        if: success()
        run: |
          git config user.name "alisa-bot"
          git config user.email "alisa@bot.local"
          git add previews/ || true
          git commit -m "preview: офлайн-превью v2 (автосборка)" || echo "no changes"
          git push || echo "push skipped"
