name: sentinel daily

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sentinel
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Full live audit (links, orphans, sitemap, JSON-LD)
        run: |
          python3 - <<'PYEOF'
          import json, re, urllib.request, urllib.error, xml.etree.ElementTree as ET
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone
          UA = {"User-Agent": "Mozilla/5.0 (site-sentinel; zapashoda-ev.ru)"}
          BASE = "https://zapashoda-ev.ru"

          def get(u, t=25):
              try:
                  r = urllib.request.Request(u, headers=UA)
                  return urllib.request.urlopen(r, timeout=t).read().decode("utf-8", errors="replace"), 200
              except urllib.error.HTTPError as e:
                  return "", e.code
              except Exception:
                  return "", 0

          sm_urls = []
          for cand in ["/sitemap-index.xml", "/sitemap.xml"]:
              body, code = get(BASE + cand)
              if code == 200 and body:
                  for m in re.finditer(r"https://zapashoda-ev\.ru/[^<]+", body):
                      sm_urls.append(m.group(0))
                  for sub in re.findall(r"https://zapashoda-ev\.ru/[^<]+\.xml", body):
                      if sub.endswith("sitemap-index.xml"): continue
                      b2, _ = get(sub)
                      sm_urls += re.findall(r"https://zapashoda-ev\.ru/[^<]+", b2)
          sm_urls = [u for u in set(sm_urls) if not u.endswith(".xml")]
          pages = set(u.rstrip("/") + "/" for u in sm_urls)
          print("pages in sitemap:", len(pages))

          results = {}
          def fetch(u):
              body, code = get(u)
              return u, code, body
          with ThreadPoolExecutor(max_workers=12) as ex:
              for u, code, body in ex.map(fetch, sorted(pages)):
                  results[u] = (code, body)

          bad = [u for u, (c, b) in results.items() if c != 200]
          inb = {}
          ld_errors = []; ld_types = {}
          total_links = 0
          for u, (c, b) in results.items():
              if c != 200 or not b: continue
              for lk in re.findall(r'href="([^"#?]+)"', b):
                  if lk.startswith("/"): lk2 = BASE + lk
                  elif lk.startswith("http") and "zapashoda-ev.ru" in lk: lk2 = lk
                  else: continue
                  lk2 = lk2.rstrip("/") + "/"
                  total_links += 1
                  if lk2 in pages and lk2 != u:
                      inb[lk2] = inb.get(lk2, 0) + 1
              for m in re.finditer(r'<script type="application/ld\+json"[^>]*>(.*?)</script>', b, re.S):
                  try:
                      d = json.loads(m.group(1))
                      t = d.get("@type", "?") if isinstance(d, dict) else "?"
                      ld_types[t] = ld_types.get(t, 0) + 1
                  except Exception as e:
                      ld_errors.append((u, str(e)[:80]))
          SYSTEM_HINTS = ("/admin/", ".html/", "/app/", "/decapcms/", "/matrix/", "/telemetry/", "/open-data/", "/shorts/", "/shop/digital/download.html/", "/shop/digital/success.html/", "/brands/", "/tools/", "/credits")
orphans = sorted(u for u in pages if u not in inb and results.get(u, (0, ""))[0] == 200 and not any(h in u for h in SYSTEM_HINTS))
          print("orphans:", len(orphans), "| ld errors:", len(ld_errors), "| ld types:", len(ld_types))
          D = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          ok = (len(bad) == 0 and len(ld_errors) == 0)
          verdict = "OK" if ok else "BROKEN"
          lines = ["# Сторож — живой сайт", "", "Прогон: %s | Вердикт: %s" % (D, verdict), "",
              "- Страниц в sitemap: %d" % len(pages),
              "- Не-200 страниц: %d" % len(bad),
              "- Внутренних ссылок всего: %d" % total_links,
              "- Сирот (0 входящих): %d" % len(orphans),
              "- Ошибок JSON-LD: %d" % len(ld_errors),
              "- Типы схем: %s" % (", ".join("%s:%d" % (k, v) for k, v in sorted(ld_types.items()))), ""]
          if bad:
              lines.append("## Не-200 страницы"); lines += ["- " + u for u in bad[:30]] + [""]
          if ld_errors:
              lines.append("## Ошибки JSON-LD"); lines += ["- %s: %s" % (u, e) for u, e in ld_errors[:20]] + [""]
          if orphans:
              lines.append("## Сироты (нет входящих ссылок)"); lines += ["- " + u for u in orphans[:40]] + [""]
          import os
          os.makedirs("intel", exist_ok=True)
          open("intel/sentinel_report.md", "w", encoding="utf-8").write("\n".join(lines))
          json.dump({"date": D, "ok": ok, "bad": bad, "ld_errors": [list(x) for x in ld_errors],
                     "orphans": orphans, "pages": len(pages), "ld_types": ld_types},
                    open("intel/sentinel_last.json", "w", encoding="utf-8"), ensure_ascii=False)
          print("VERDICT:", verdict)
          print("report written")
          PYEOF

      - name: Commit report
        run: |
          git config user.name "bot-sentinel"
          git config user.email "bot@zapashoda-ev.ru"
          git add intel/
          git commit -m "bot: daily report [skip ci]" || echo "no changes"
          git push

      - name: Badge (red if broken)
        run: |-
          python3 -c "import json,sys; d=json.load(open('intel/sentinel_last.json')); print('VERDICT:', d['ok']); sys.exit(0 if d['ok'] else 2)"
