name: build & deploy

on:
  schedule:
    - cron: "13 */3 * * *"
  push:
    branches: [main, astrowind-migration]
    paths:
      - "data/**"
      - "build.py"
      - "services.py"
      - "artv3.py"
      - "catalog.py"
      - "style.css"
      - "scripts/**"
      - ".github/workflows/site.yml"
      - "site/src/**"
      - "site/public/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main

      - uses: actions/checkout@v4
        with:
          ref: astrowind-migration
          path: astro

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro/site/package-lock.json

      - name: Install deps
        working-directory: astro/site
        run: npm ci

      - name: Sync prod data (new articles -> Astro tree)
        run: python3 main/scripts/astro_data_sync.py

      - name: Build site (Astro)
        working-directory: astro/site
        run: npm run build

      - name: Pagefind index
        working-directory: astro/site
        run: npx --yes pagefind --site dist

      - name: QA suite (smoke — fail)
        working-directory: astro/site
        run: |
          test -f dist/index.html || { echo 'MISSING dist/index.html'; exit 1; }
          test -f dist/sitemap.xml || { echo 'MISSING dist/sitemap.xml'; exit 1; }
          test -f dist/robots.txt || { echo 'MISSING dist/robots.txt'; exit 1; }
          test -f dist/models/index.html || { echo 'MISSING dist/models/index.html'; exit 1; }
          test -f dist/models/zeekr-001-001-fr/index.html || { echo 'MISSING model detail'; exit 1; }
          test -f dist/blog/index.html || { echo 'MISSING dist/blog/index.html'; exit 1; }
          test -f dist/blog/gbt-stancii-2026/index.html || { echo 'MISSING blog detail'; exit 1; }
          test -f dist/pain/index.html || { echo 'MISSING dist/pain/index.html'; exit 1; }
          test -f dist/pain/12v-akb/index.html || { echo 'MISSING pain detail'; exit 1; }
          test -f dist/safety/index.html || { echo 'MISSING dist/safety/index.html'; exit 1; }
          test -f dist/llms.txt || { echo 'MISSING llms.txt'; exit 1; }
          test -f dist/assets/og/b-gbt-stancii-2026.png || { echo 'MISSING og article image'; exit 1; }
          test -f dist/assets/og/m-aito-m5-m7.png || { echo 'MISSING og model image'; exit 1; }
          grep -q FAQPage dist/pain/12v-akb/index.html || { echo 'MISSING FAQPage JSON-LD on pain article'; exit 1; }
          test -f dist/shop/digital/index.html || { echo 'MISSING dist/shop/digital/index.html'; exit 1; }
          test -f dist/charging/index.html || { echo 'MISSING dist/charging/index.html'; exit 1; }
          test -f dist/charging/stations.json || { echo 'MISSING stations.json'; exit 1; }
          test -f dist/assets/leaflet/leaflet.js || { echo 'MISSING leaflet.js'; exit 1; }
          grep -q "Зарядные станции рядом" dist/charging/index.html || { echo 'MISSING charging H1'; exit 1; }
          test -f dist/quiz/index.html || { echo 'MISSING dist/quiz/index.html'; exit 1; }
          test -f dist/b2b/index.html || { echo 'MISSING dist/b2b/index.html'; exit 1; }
          test -f dist/b2b/paket-dileram.pdf || { echo 'MISSING paket-dileram.pdf'; exit 1; }
          test -f dist/rss.xml || { echo 'MISSING rss.xml'; exit 1; }
          test -f dist/catalog/index.html || { echo 'MISSING dist/catalog/index.html'; exit 1; }
          grep -q "₽" dist/catalog/index.html || { echo 'MISSING price in catalog'; exit 1; }
          NITEM=$(find dist/catalog -name 'index.html' | wc -l)
          [ "$NITEM" -ge 27 ] || { echo "MISSING catalog items: only $NITEM"; exit 1; }
          test -f dist/services/index.html || { echo 'MISSING dist/services/index.html'; exit 1; }
          test -f dist/cost/avatr-11-12-ofitsialno-ru.html || test -f dist/cost/avatr-11-12-ofitsialno-ru.html/index.html || { echo 'MISSING cost page'; exit 1; }
          test -f dist/news/index.html || { echo 'MISSING dist/news/index.html'; exit 1; }
          test -f dist/about/index.html || { echo 'MISSING dist/about/index.html'; exit 1; }
          NMOD=$(find dist/models -maxdepth 2 -name 'index.html' | wc -l)
          [ "$NMOD" -ge 146 ] || { echo "MISSING model pages: only $NMOD"; exit 1; }
          NART=$(find dist/blog -maxdepth 2 -name 'index.html' | wc -l)
          [ "$NART" -ge 20 ] || { echo "MISSING blog pages: only $NART"; exit 1; }
          echo "SMOKE OK (models/blog/pain/safety/shop/map/quiz/b2b/rss/catalog/services/cost/news/about)"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./astro/site/dist
          cname: zapashoda-ev.ru

      - name: Ping IndexNow (Yandex/Bing)
        run: python3 main/scripts/indexnow_ping.py

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Lighthouse audit (info only)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://zapashoda-ev.ru/
            https://zapashoda-ev.ru/models/
            https://zapashoda-ev.ru/models/zeekr-001-001-fr/
            https://zapashoda-ev.ru/charging/
          uploadArtifacts: true
