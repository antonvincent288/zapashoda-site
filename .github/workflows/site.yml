name: build & deploy

on:
  schedule:
    - cron: "13 */3 * * *"
  push:
    branches: [main]
    paths: ["data/**", "build.py", "services.py", "artv3.py", "catalog.py", "style.css"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests pillow

      - name: Collect news (optional LLM)
        env:
          GIGA_AUTH_KEY: ${{ secrets.GIGA_AUTH_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/collector.py || true

      - name: Commit collected news
        run: |
          git config user.email "actions@users.noreply.github.com"
          git config user.name "zapashoda-news-bot"
          git add data
          git diff --cached --quiet || (git commit -m "news: auto-collected" && git push)

      - name: Build site
        run: python build.py _site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          cname: zapashoda-ev.ru
