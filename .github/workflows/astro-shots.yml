name: Astro screenshots (astrowind-migration)
on:
  push:
    branches: [astrowind-migration]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Take screenshots
        run: python3 scripts/take_shots.py

      - name: Commit screenshots
        run: |
          git config user.name "alisa-robot"
          git config user.email "bot@zapashoda-ev.ru"
          git add -A reports/astrowind_previews
          if git status --porcelain | grep -q .; then
            git commit -m "shots: превью-скриншоты wave 4 (prod-структура)"
            git push origin astrowind-migration
          else
            echo "no changes"
          fi
