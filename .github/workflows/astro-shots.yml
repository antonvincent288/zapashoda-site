name: Astro screenshots (astrowind-migration)
on:
  push:
    branches: [astrowind-migration]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Install playwright
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Start local server
        run: |
          (cd site/dist && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 3
      - name: Take screenshots
        run: python3 scripts/take_shots.py

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: astrowind_previews
          path: reports/astrowind_previews
          retention-days: 14
