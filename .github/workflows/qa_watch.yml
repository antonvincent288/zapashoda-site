name: qa-watch (patrol 2h)

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: QA patrol
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/qa_watch.py
      - name: Commit report
        run: |
          git config user.email "actions@users.noreply.github.com"
          git config user.name "qa-watch-bot"
          git add bridge/qa_watch.json
          git diff --cached --quiet || (git commit -m "watch: qa report [skip ci]" && git push)
