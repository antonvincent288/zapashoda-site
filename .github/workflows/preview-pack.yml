name: Preview Pack
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: site/package-lock.json }
      - name: Build
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Pack preview
        run: python3 scripts/make_preview.py
      - name: Commit preview
        run: |
          git config user.name "alisa-bot"
          git config user.email "alisa@bot.local"
          git add previews/ scripts/
          git commit -m "preview: офлайн-превью v2 (14 страниц, wave9)" || echo "no changes"
          git push
