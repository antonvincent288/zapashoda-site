name: Slide video render (R-06 образцы)

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'slug ролика (пусто = встроенный образец slide-01)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ffmpeg + pillow
        run: |
          sudo apt-get -y install ffmpeg
          pip install -q pillow
      - name: Render slide video
        run: python scripts/slide_video_render.py --out-dir assets/shorts/draft
      - name: Commit draft
        run: |
          git config user.name "shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/shorts/draft || true
          if ! git diff --cached --quiet; then
            git commit -m "video: draft slide render [skip ci]"
            git fetch origin main
            git pull --rebase origin main && git push || echo "push skipped (conflict)"
          fi
