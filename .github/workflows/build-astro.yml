name: astro build (migration)

on:
  push:
    branches: [astro-migration]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Build site
        run: pnpm run build
      - name: Pagefind index
        run: pnpm exec pagefind --site dist || true
