name: YT download probe 4

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Cobalt deep probe
        run: |
          set +e
          echo "=== instances list ==="
          curl -sS --max-time 25 "https://instances.cobalt.best/api/instances.json" -o /tmp/cb.json; echo "curl rc=$?"
          head -c 400 /tmp/cb.json; echo
          echo "=== api.cobalt.tools POST ==="
          curl -sS --max-time 30 -X POST "https://api.cobalt.tools/" \
            -H "Accept: application/json" -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0" \
            -d '{"url":"https://www.youtube.com/shorts/K0GV_0xE3Y8","videoQuality":"480","filenameStyle":"basic"}'; echo
          echo "=== api.cobalt.best POST ==="
          curl -sSk --max-time 30 -X POST "https://api.cobalt.best/" \
            -H "Accept: application/json" -H "Content-Type: application/json" \
            -d '{"url":"https://www.youtube.com/shorts/K0GV_0xE3Y8","videoQuality":"480","filenameStyle":"basic"}'; echo
      - name: Free endpoint guesses
        run: |
          set +e
          echo "=== yewtu.be latest_version ==="
          curl -sS --max-time 20 -A "Mozilla/5.0" "https://yewtu.be/latest_version?id=K0GV_0xE3Y8&itag=18&local=true" -o /tmp/y.mp4; echo "rc=$? size=$(stat -c%s /tmp/y.mp4 2>/dev/null)"
          head -c 200 /tmp/y.mp4; echo
          echo "=== yt-dlp web client + POT, verbose (ключевые строки) ==="
          pip install -q -U yt-dlp yt-dlp-ejs bgutil-ytdlp-pot-provider
          docker run -d -p 4416:4416 --name pot brainicism/bgutil-ytdlp-pot-provider
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:4416/ping >/dev/null && break; sleep 3; done
          yt-dlp -v --no-playlist --extractor-args "youtube:player_client=web" \
            --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416" \
            "https://www.youtube.com/shorts/K0GV_0xE3Y8" 2>&1 | grep -iE 'pot|error|sign in|visitor|token' | head -15
