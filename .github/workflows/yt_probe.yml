name: YT download probe 3

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install -q -U yt-dlp yt-dlp-ejs bgutil-ytdlp-pot-provider
          sudo apt-get -y install ffmpeg >/dev/null
      - name: Probe web_music on other videos
        run: |
          set +e
          for id in HSKthPNbZtA CGDoQGNma74 7tJA8I_WF2k nBBrJIdYDpg oWXRO9EnMAA; do
            echo "=== web_music $id ==="
            rc=0
            timeout 90 yt-dlp -f 'best[ext=mp4]/best' --no-playlist --no-warnings --max-filesize 60M \
              --extractor-args "youtube:player_client=web_music" \
              -o "/tmp/p3_$id.%(ext)s" "https://www.youtube.com/watch?v=$id" > /tmp/log_$id.txt 2>&1 || rc=$?
            f=$(ls /tmp/p3_$id.* 2>/dev/null | head -1)
            if [ -n "$f" ]; then
              echo "FILE OK: $(stat -c%s "$f") bytes, dur=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f" 2>/dev/null)"
            else
              echo "FAIL rc=$rc: $(grep -m1 -oE 'ERROR: .{0,90}' /tmp/log_$id.txt)"
            fi
          done
          echo "=== combo music+web+POT ==="
          timeout 90 yt-dlp -f 'best[ext=mp4]/best' --no-playlist --no-warnings \
            --extractor-args "youtube:player_client=web_music,web" \
            --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416" \
            -o "/tmp/p3_combo.%(ext)s" "https://www.youtube.com/watch?v=7tJA8I_WF2k" > /tmp/log_combo.txt 2>&1 || true
          f=$(ls /tmp/p3_combo.* 2>/dev/null | head -1)
          [ -n "$f" ] && echo "COMBO FILE OK: $(stat -c%s "$f")" || echo "COMBO FAIL: $(grep -m1 -oE 'ERROR: .{0,90}' /tmp/log_combo.txt)"
