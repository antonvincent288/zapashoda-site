name: yt-probe5

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Bot-to-bot test
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          echo "=== bot -> @SaveAsBot ==="
          curl -sS --max-time 20 "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            --data-urlencode "chat_id=@SaveAsBot" --data-urlencode "text=ping" ; echo
      - name: Cobalt community instances
        run: |
          set +e
          curl -sk --max-time 25 "https://instances.cobalt.best/api/instances.json" -o /tmp/cb.json; echo "rc=$? size=$(stat -c%s /tmp/cb.json 2>/dev/null)"
          python3 - <<'EOF'
          import json
          try:
              data = json.load(open('/tmp/cb.json'))
          except Exception as e:
              print('parse fail:', type(e).__name__); raise SystemExit(1)
          good = []
          for i in data:
              if not isinstance(i, dict): continue
              svcs = i.get('services') or {}
              if not svcs.get('youtube'): continue
              api = i.get('api') or ''
              if not api.startswith('http'): api = 'https://' + api
              good.append({'api': api, 'turnstile': bool((i.get('turnstile') or {}).get('sitekey'))})
          print('youtube-capable:', len(good))
          for g in good[:10]: print('  ', g['api'], '| turnstile:', g['turnstile'])
          open('/tmp/good.json','w').write(json.dumps(good))
          EOF
          for i in 0 1 2 3; do
            api=$(python3 -c "import json;print(json.load(open('/tmp/good.json'))[$i]['api'])" 2>/dev/null) || continue
            echo "=== POST $api ==="
            curl -sk --max-time 25 -X POST "$api" \
              -H "Accept: application/json" -H "Content-Type: application/json" \
              -d '{"url":"https://www.youtube.com/shorts/K0GV_0xE3Y8","videoQuality":"480","filenameStyle":"basic","youtubeVideoCodec":"h264"}'; echo
          done
      - name: Wikimedia Commons plan B
        run: |
          set +e
          curl -s --max-time 25 -A "zapashoda-bot/1.0" \
            "https://commons.wikimedia.org/w/api.php?action=query&list=search&srsearch=electric%20car%20charging%20filetype:video&srnamespace=6&srlimit=10&format=json" \
            -o /tmp/commons.json; echo "rc=$?"
          python3 - <<'EOF'
          import json
          try:
              d = json.load(open('/tmp/commons.json'))
              hits = d.get('query', {}).get('search', [])
              print('commons hits:', len(hits))
              for h in hits[:10]: print('  ', h.get('title'))
          except Exception as e:
              print('commons fail:', type(e).__name__)
          EOF
