name: GAS monitor
on:
  schedule:
    - cron: '40 5 * * *'   # ежедневно 08:40 МСК
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: gas-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: GAS selftest check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gas_monitor.py
