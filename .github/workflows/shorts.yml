name: Shorts autopilot

on:
  schedule:
    # 10:00, 14:00, 18:00, 22:00 МСК
    - cron: '0 7,11,15,19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install yt-dlp + EJS + POT provider
        run: |
          pip install -q yt-dlp yt-dlp-ejs bgutil-ytdlp-pot-provider
          docker run -d -p 4416:4416 --name pot brainicism/bgutil-ytdlp-pot-provider
          sleep 8
          curl -s http://127.0.0.1:4416/ping || true
      - name: Post one short
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          MIN_VIEWS: '500'
        run: |
          sudo apt-get -y install ffmpeg || true
          python scripts/shorts_bot.py
      - name: Ingest shorts from architect (R-06)
        run: |
          sudo apt-get -y install ffmpeg || true
          python scripts/shorts_ingest.py
      - name: Screencasts (R-06 QA, info-only)
        continue-on-error: true
        run: |
          pip install -q playwright imageio-ffmpeg
          python -m playwright install chromium --with-deps || python -m playwright install chromium
          python scripts/screen_capture_qa.py --pages calculator,routes --frames 30
      - name: Commit dedup
        run: |
          git config user.name "shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/published.json scripts/shorts_published.json data/shorts.json assets/shorts/published || true
          if ! git diff --cached --quiet; then
            git commit -m "shorts: dedup update [skip ci]" || true
            for i in 1 2 3; do
              git fetch origin main
              git pull --rebase origin main && git push && break || (echo "push retry $i"; sleep 10)
            done
          fi
          echo "dedup step done (push conflicts are tolerated)"
