name: Shorts autopilot

on:
  schedule:
    # 10:00, 14:00, 18:00, 22:00 МСК
    - cron: '0 7,11,15,19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install yt-dlp
        run: pip install -q yt-dlp
      - name: Post one short
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          MIN_VIEWS: '5000'
        run: python scripts/shorts_bot.py
      - name: Commit dedup
        run: |
          git config user.name "shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/published.json
          git diff --cached --quiet || git commit -m "shorts: dedup update [skip ci]"
          git push
