name: Architect bot
on:
  schedule:
    - cron: '30 1,4,7,10,13,16,19,22 * * *'   # каждые 3 ч (offset от site.yml 13 */3)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: architect-bot
  cancel-in-progress: false
jobs:
  architect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests pillow
      - name: Architect bot (Pollinations GPT-OSS 20B)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/architect_bot.py
      - name: Validate & apply drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/validate_drafts.py
