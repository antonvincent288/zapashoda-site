name: alisa autopilot (daily GEO + smoke)

on:
  schedule:
    - cron: '0 6 * * *'  # 09:00 MSK
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: alisa-autopilot
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Smoke checks (prod)
        run: |
          set -e
          for u in / /search/ /rss.xml /sitemap-index.xml /.well-known/ai.txt /llms.txt /ai/summary.json /calculator/; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "https://zapashoda-ev.ru$u")
            echo "$u -> $code"
            [ "$code" = "200" ] || { echo "SMOKE FAIL: $u"; exit 1; }
          done
          echo "SMOKE OK"

      - name: GEO audit (prod)
        run: |
          pip install -q geo-optimizer-skill
          timeout 300 geo audit --url https://zapashoda-ev.ru > /tmp/geo.txt || true
          SCORE=$(grep -A3 'FINAL GEO SCORE' /tmp/geo.txt | grep -oP '[0-9]+(?=/100)' | head -1 || echo 0)
          echo "SCORE=$SCORE"

      - name: Append history
        run: |
          SCORE=$(grep -A3 'FINAL GEO SCORE' /tmp/geo.txt | grep -oP '[0-9]+(?=/100)' | head -1 || echo 0)
          TRUST=$(grep -oP 'Trust level: \w+' /tmp/geo.txt | head -1 | sed 's/Trust level: //' || echo "n/a")
          D=$(date -u +"%Y-%m-%d %H:%M UTC")
          printf '| %s | %s | %s |\n' "$D" "$SCORE" "$TRUST" >> docs/geo_history.md

      - name: Commit history
        run: |
          git config user.name "alisa-autopilot"
          git config user.email "autopilot@zapashoda-ev.ru"
          git add docs/geo_history.md
          git commit -m "autopilot: daily geo history [skip ci]" || echo "no changes"
          git push
