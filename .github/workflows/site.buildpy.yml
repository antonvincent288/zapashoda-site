name: build & deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests pillow

      - name: Collect news (optional LLM)
        env:
          GIGA_AUTH_KEY: ${{ secrets.GIGA_AUTH_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/collector.py || true

      - name: Commit collected news
        run: |
          git config user.email "actions@users.noreply.github.com"
          git config user.name "zapashoda-news-bot"
          git add data
          git diff --cached --quiet || (git commit -m "news: auto-collected" && git push)

      - name: R-09 winter SEO trigger
        run: python scripts/weather_trigger.py
      - name: Build site
        run: python build.py _site
      - name: QA suite (regress gate — fail)
        run: python scripts/qa_suite.py _site
      - name: Fact-check factory drafts (report — не блокирует деплой)
        run: python scripts/qa_suite.py _site --drafts bridge/drafts/guides
        continue-on-error: true
      - name: Visual QA
        run: python scripts/visual_qa.py _site
      - name: B2B QR booklets (если seed есть)
        run: pip install -q qrcode reportlab && python scripts/b2b_qr_booklets.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          cname: zapashoda-ev.ru
      - name: Ping IndexNow (Yandex/Bing)
        run: python3 scripts/indexnow_ping.py

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Lighthouse audit (info only)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://zapashoda-ev.ru/
            https://zapashoda-ev.ru/catalog/
            https://zapashoda-ev.ru/models/zeekr-001-001-fr.html
            https://zapashoda-ev.ru/charging/
          uploadArtifacts: true
