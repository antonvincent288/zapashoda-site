name: Geocode audit

on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astrowind-migration

      - name: Run audit
        run: python3 tools/geocode_audit.py

      - name: Commit results
        run: |
          git config user.name "geo-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "geocode audit: сверка координат ЭЗС"
          git push origin astrowind-migration
