name: Geocode audit

on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Сколько точек проверять (0 = все)"
        required: false
        default: "400"
      offset:
        description: "Индекс первой точки батча"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astrowind-migration

      - name: Run audit
        env:
          AUDIT_LIMIT: ${{ github.event.inputs.limit || '0' }}
          AUDIT_OFFSET: ${{ github.event.inputs.offset || '0' }}
        run: python3 tools/geocode_audit.py

      - name: Commit results
        run: |
          git config user.name "geo-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin astrowind-migration
          git rebase origin/astrowind-migration || true
          git add -A
          git diff --cached --quiet || git commit -m "geocode audit: сверка координат ЭЗС (batch)"
          git push origin HEAD:astrowind-migration
