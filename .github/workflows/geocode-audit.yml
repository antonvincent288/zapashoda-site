name: Geocode audit

on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Сколько точек проверять (0 = все)"
        required: false
        default: "400"
      offset:
        description: "Индекс первой точки батча"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astrowind-migration

      - name: Run audit
        env:
          AUDIT_LIMIT: ${{ github.event.inputs.limit || '0' }}
          AUDIT_OFFSET: ${{ github.event.inputs.offset || '0' }}
        run: python3 tools/geocode_audit.py

      - name: Commit results
        run: |
          git config user.name "geo-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "geocode audit: сверка координат ЭЗС (batch)"
          git fetch origin astrowind-migration
          git rebase origin/astrowind-migration
          git push origin HEAD:astrowind-migration
      - name: Next batch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOTAL=$(python3 -c "import json;print(len(json.load(open('site/public/charging/stations.json'))['stations']))")
          NEXT=$(( ${{ github.event.inputs.offset || 0 }} + ${{ github.event.inputs.limit || 400 }} ))
          if [ "$NEXT" -lt "$TOTAL" ]; then
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/geocode-audit.yml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"limit\":\"400\",\"offset\":\"$NEXT\"}}"
          fi
