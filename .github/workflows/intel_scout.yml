name: scout daily

on:
  schedule:
    - cron: '50 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  dig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dig GitHub + HN + npm (dedup into intel/)
        env:
          SCOUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "print('probe ok')"

      - name: Commit report
        run: |
          git config user.name "bot-scout"
          git config user.email "bot@zapashoda-ev.ru"
          git add intel/
          git commit -m "bot: daily report [skip ci]" || echo "no changes"
          git push
