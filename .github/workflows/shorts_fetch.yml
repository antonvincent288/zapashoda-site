name: Shorts fetcher (SaveAsBot flow)

on:
  schedule:
    - cron: '0 8,16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -q "telethon>=1.36"
          sudo apt-get -y install ffmpeg >/dev/null
      - name: Fetch and post
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          MIN_VIEWS: '500'
        run: python -u scripts/shorts_fetch.py
      - name: Commit dedup
        run: |
          git config user.name "fetch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/published.json || true
          if ! git diff --cached --quiet; then
            git commit -m "fetch: dedup update [skip ci]" || true
            for i in 1 2 3; do
              git fetch origin main
              git pull --rebase origin main && git push && break || (echo "push retry $i"; sleep 10)
            done
          fi
          echo "dedup done"
